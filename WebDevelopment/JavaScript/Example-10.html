<!-- Write a Program in Javascript to demonstrate functions -->
<html>
    <head>
        <script language="javascript">
            function add(a, b){
                return a + b;
            }

            function greet(name){
                return "Hello, " + name + "!";
            }

            document.write(add(5, 3) + "<br>");
            document.write(greet("Umang") + "<br>");
        </script>
    </head>
</html>
