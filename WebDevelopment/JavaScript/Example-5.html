<!-- Write a Program in Javascript to demonstrate variables and data types -->
<html>
    <head>
        <script language="javascript">
            var num = 10;           // Number
            var str = "Hello";      // String
            var flag = true;        // Boolean
            var nothing = null;     // Null

            document.write("Number: " + num + "<br>");
            document.write("String: " + str + "<br>");
            document.write("Boolean: " + flag + "<br>");
            document.write("Null: " + nothing + "<br>");
        </script>
    </head>
</html>
